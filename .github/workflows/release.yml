name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - ".github/workflows/release.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # 确定本次构建对应的 release:
  # - push 到 main: 自动创建 pre-release,tag 为 <版本号>+build.<run_number>
  # - 手动创建 release: 直接使用该 release 和用户填写的 tag
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.info.outputs.release_id }}
      tag: ${{ steps.info.outputs.tag }}
      previous_tag: ${{ steps.notes.outputs.previous_tag }}
      target_sha: ${{ steps.notes.outputs.target_sha }}
      previous_sha: ${{ steps.notes.outputs.previous_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare commit-based notes
        id: notes
        env:
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
            TAG="${VERSION}+build.${RUN_NUMBER}"
          fi
          export TAG
          node scripts/release-notes.mjs

      - name: Resolve release
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          TAG: ${{ steps.notes.outputs.tag }}
          TARGET_SHA: ${{ steps.notes.outputs.target_sha }}
        run: |
          if [ "$EVENT_NAME" != "release" ]; then
            # Reuse only this build's release on reruns; do not create a duplicate.
            gh api --paginate --slurp "repos/$REPO/releases?per_page=100" > releases.json
            RELEASE_ID=$(node -e "const pages = require('./releases.json'); const release = pages.flat().find(r => r.tag_name === process.env.TAG); if (release) process.stdout.write(String(release.id));")
          fi
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(gh api "repos/$REPO/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$TARGET_SHA" \
              -f name="$TAG" \
              -F prerelease=true \
              -F body=@body.md \
              --jq .id)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: x86 / x86_64 / arm64
          - os: windows-latest
            target: i686-pc-windows-msvc
            args: --target i686-pc-windows-msvc
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          # WiX(msi) 不支持 arm64,只出 NSIS 安装包
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          # Linux: x86_64 / arm64 (32 位 x86 的 WebKitGTK 依赖不可用,不构建)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""
          # macOS: x86_64 (Intel) / arm64 (Apple Silicon)
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 手动 release 时,把用户的 tag(去掉可能的 v 前缀)写入应用版本号
      - name: Set app version from tag
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}" node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          "

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Android signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are incomplete; skipping the Android release build."
          fi

      - name: Set app version from tag
        if: steps.signing.outputs.configured == 'true' && github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}" node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          "

      - uses: pnpm/action-setup@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          version: 11

      - uses: actions/setup-node@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.configured == 'true'
        with:
          # The legacy "tools" package is no longer available from the Android SDK.
          packages: platform-tools

      - name: Install Android SDK and NDK
        if: steps.signing.outputs.configured == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.signing.outputs.configured == 'true'
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        if: steps.signing.outputs.configured == 'true'
        with:
          workspaces: src-tauri
          key: android-aarch64

      - name: Install dependencies
        if: steps.signing.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        if: steps.signing.outputs.configured == 'true'
        run: pnpm tauri android init --ci --skip-targets-install

      - name: Build Android arm64 APK
        if: steps.signing.outputs.configured == 'true'
        run: pnpm tauri android build --target aarch64 --apk --ci

      - name: Sign Android APK
        if: steps.signing.outputs.configured == 'true'
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' -print -quit)
          test -n "$UNSIGNED_APK"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          OUTPUT_APK="GugleAI-${VERSION}-android-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f 4 "$UNSIGNED_APK" aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUTPUT_APK" \
            aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$OUTPUT_APK"
          echo "path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: gh release upload "$TAG" "$APK" --clobber

  # 所有平台构建完成后,使用 prepare 固定的提交范围生成更新内容和下载表格
  update-release-notes:
    needs: [prepare, build, android]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes and download table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          PREVIOUS_SHA: ${{ needs.prepare.outputs.previous_sha }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          gh api "repos/$REPO/releases/$RELEASE_ID" > release.json
          git fetch --force --tags
          node scripts/release-notes.mjs release.json
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F body=@body.md
